services:
  database:
    image: postgres:18.1-alpine3.23
    environment:
      - POSTGRES_DB=roomChatDB
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
    ports:
      - 5433:5432
    restart: always
    volumes:
      - roomChatVol:/var/lib/postgresql

  redis_db:
    image: redis:8.6-rc1-alpine
    ports:
      - 6379:6379

volumes:
  roomChatVol:
